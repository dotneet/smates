name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::files not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # Dogfoods smates on its own unit tests (suite "go" in smates.yml): everything on
      # main, the affected packages on pull requests, with the state cached per OS.
      - name: Run affected tests
        uses: ./
        with:
          version: source
          args: --suite go --no-agent

  e2e:
    # Runs the real toolchains (node, bun, uv/pytest, go) against fixture projects.
    # One job per e2e suite in smates.yml, each a shard of the fixtures of about equal
    # run time, selected by smates: a job is skipped when a pull request changes nothing
    # its fixtures and the smates code they use depend on. Not recorded, so no state is
    # kept and pull requests diff against the base branch.
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - e2e-polyglot-scenarios
          - e2e-polyglot-others
          - e2e-jest-node
          - e2e-vitest-python
          - e2e-others
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Run e2e tests if affected
        uses: ./
        with:
          version: source
          args: --suite ${{ matrix.suite }} --no-record --no-agent
          cache: 'false'

  action:
    # Smoke-tests action.yml itself on every runner OS, building smates from this checkout.
    name: action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test the action's helpers
        shell: bash
        run: bash action/lib_test.sh
      - id: smates
        uses: ./
        with:
          version: source
          command: version
          cache: 'false'
      - name: Check outputs and PATH
        shell: bash
        env:
          EXIT_CODE: ${{ steps.smates.outputs.exit-code }}
          VERSION: ${{ steps.smates.outputs.version }}
          VERIFIED: ${{ steps.smates.outputs.verified }}
        run: |
          test "$EXIT_CODE" = 0
          test "$VERSION" = source
          test "$VERIFIED" = none
          smates version

  pr-comment:
    # Dogfoods the action's pull request comment: smates' selection for its own Go
    # packages, kept as one sticky comment. Selection only, so no tests run twice.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # no state is cached: diff against the base branch
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: smates
        uses: ./
        with:
          version: source
          command: select
          args: --suite go --no-agent
          cache: 'false'
          comment: 'true'
      - name: Check the comment
        # Pull requests from forks get a read-only token: the action skips the comment.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          URL: ${{ steps.smates.outputs.comment-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$URL"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/${URL##*-}" --jq .body | tee comment.md
          head -n1 comment.md | grep -qx '<!-- smates-summary -->'
          grep -q '^### smates: ' comment.md
