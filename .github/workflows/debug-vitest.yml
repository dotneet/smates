# TEMPORARY: diagnoses a Linux-only vitest attribution gap; delete before merging.
name: debug-vitest
on:
  push:
    branches: [claude/ci-test-optimization-37da9c]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record the vitest fixture repeatedly
        run: |
          go build -o "$RUNNER_TEMP/smates" ./cmd/smates
          W="$RUNNER_TEMP/vt"; cp -R e2e/fixtures/vitest-npm "$W"; cd "$W"
          git init -q && git add -A && git -c user.email=a@b -c user.name=a commit -qm x
          npm ci --no-audit --no-fund >/dev/null
          echo "nproc=$(nproc)"
          mkdir -p "$RUNNER_TEMP/bad"; bad=0
          for k in $(seq 1 25); do
            rm -rf .smates
            SMATES_KEEP_TRACE=1 CI= GITHUB_ACTIONS= "$RUNNER_TEMP/smates" run --all --no-agent > "$RUNNER_TEMP/run.log" 2>&1
            T=$(sed -n 's/.*keeping trace files in //p' "$RUNNER_TEMP/run.log")
            miss=""
            for t in test/*.test.ts; do "$RUNNER_TEMP/smates" deps "$t" | grep -q '^test/setup.ts' || miss="$miss $t"; done
            if [ -n "$miss" ]; then
              bad=$((bad+1)); echo "run $k: untraced:$miss"
              grep -i "smates:" "$RUNNER_TEMP/run.log"
              cp -R "$T" "$RUNNER_TEMP/bad/run-$k"
              for f in "$T"/suite-0/proc-*.jsonl; do echo "== $(basename $f) $(head -1 $f | grep -o '"argv":\[[^]]*' | sed 's/.*node",//' | cut -c1-120) lines=$(grep -c . $f) last=$(tail -1 $f | cut -c1-120)"; done
              ls -la "$T"/suite-0/v8
            else
              echo "run $k: ok"
            fi
            rm -rf "$T"
          done
          echo "bad=$bad/25"
          tar czf "$RUNNER_TEMP/trace.tgz" -C "$RUNNER_TEMP/bad" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-trace
          path: ${{ runner.temp }}/trace.tgz
