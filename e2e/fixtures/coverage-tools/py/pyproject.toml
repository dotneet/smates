[project]
name = "calc"
version = "0.1.0"
description = "Arithmetic helpers, tested with pytest-cov and pytest-xdist."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "pytest-xdist>=3.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
